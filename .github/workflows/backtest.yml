name: Backtest

# Replays a strategy over historical candles with the same trade rules as
# the live outcome tracker (see src/backtest.py) and saves the results for
# /admin/performance and the dashboard's "Strong backtest" badges and
# backtest lines.
#
# Runs by itself every Sunday for both markets and both strategies, so
# those figures stay current, and by hand from the Actions tab. Sunday
# because it's the day Twelve Data's free 800 requests have the most room:
# the live gold feed peaks on Saturday (about 700, retrying a closed
# market) and a full gold backtest adds about 25. Each week adds 12 small
# rows to backtest_runs.
on:
  schedule:
    - cron: "17 3 * * 0" # Sundays 03:17 UTC
  workflow_dispatch:
    inputs:
      symbol:
        description: "Market. Gold uses Twelve Data requests the live feed needs — run it rarely."
        type: choice
        options: [BTCUSDT, XAUUSD]
        default: BTCUSDT
      strategy:
        description: "Strategy to replay"
        type: choice
        options: [confluence, guda_special, both]
        default: both
      timeframes:
        description: "Timeframes for the confluence engine (GUDA SPECIAL is always 15m)"
        type: string
        default: "5m,15m,1h,4h,1d"
      days:
        description: "Days of history for every timeframe (blank = 60 for 5m up to 6 years for 1d)"
        type: string
        default: ""
      variants:
        description: 'Compare setting variations instead, e.g. "base: ; wide: min_stop_atr=1, target_mode=atr" (never saved)'
        type: string
        default: ""
      publish:
        description: "Save results to the admin Performance page"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # One market at a time, like a manual run.
      max-parallel: 1
      matrix:
        # A manual run backtests the market it was given; the weekly run
        # does both.
        symbol: ${{ fromJSON(github.event_name == 'schedule' && '["BTCUSDT","XAUUSD"]' || format('["{0}"]', inputs.symbol)) }}
    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest
        # A scheduled run has no inputs: every strategy and timeframe, the
        # default history, saved.
        env:
          SYMBOL: ${{ matrix.symbol }}
          STRATEGY: ${{ inputs.strategy || 'both' }}
          TIMEFRAMES: ${{ inputs.timeframes || '5m,15m,1h,4h,1d' }}
          DAYS: ${{ inputs.days }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
          VARIANTS: ${{ inputs.variants }}
        run: |
          args=(--symbol "$SYMBOL" --summary-file "$GITHUB_STEP_SUMMARY")
          if [ -n "$DAYS" ]; then args+=(--days "$DAYS"); fi
          if [ "$PUBLISH" = "true" ]; then args+=(--publish); fi
          if [ -n "$VARIANTS" ]; then
            IFS=';' read -ra variant_list <<< "$VARIANTS"
            for v in "${variant_list[@]}"; do args+=(--variant "$v"); done
          fi
          if [ "$STRATEGY" = "confluence" ] || [ "$STRATEGY" = "both" ]; then
            python -m src.backtest "${args[@]}" --strategy confluence --timeframes "$TIMEFRAMES"
          fi
          if [ "$STRATEGY" = "guda_special" ] || [ "$STRATEGY" = "both" ]; then
            python -m src.backtest "${args[@]}" --strategy guda_special
          fi

      - name: Keep the per-trade CSVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ matrix.symbol }}-${{ github.run_id }}
          path: backtest-results/
          if-no-files-found: ignore
