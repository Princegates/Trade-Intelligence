name: Poll markets and compute signals

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch candles and compute signals
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          # Optional: mirrors signals to Supabase so the web dashboard shows
          # them. Without these the run still writes its local SQLite history.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m src.run

      - name: Commit updated database
        run: |
          git config user.name "trade-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/trade_intelligence.db
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update signals $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
