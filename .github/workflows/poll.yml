name: Poll markets and compute signals

on:
  # An external scheduler drives the real cadence (see "Keeping the feed
  # fresh" in README.md). GitHub's own schedule: is best-effort and is
  # dropped under load — measured on this repo, roughly 2 of 40 expected
  # runs fired over ten hours, which is why the short timeframes were
  # permanently stale. It is kept below only as a free backstop.
  repository_dispatch:
    types: [poll]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  # Read-only: nothing is written back to the repository any more.
  contents: read

# Fires every 5 minutes, but queued runs have been observed waiting 10-15
# minutes for a runner before — without this, a stale queued run just sits
# there competing for a slot until GitHub cancels it, instead of yielding to
# whichever trigger is actually newest. Safe to cancel in progress: each run
# only fetches current market data and computes signals from it, so a
# superseded run's output would already be stale by the time it finished.
concurrency:
  group: poll
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch candles and compute signals
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          # Optional: mirrors signals to Supabase so the web dashboard shows
          # them. Without these the run still writes its local SQLite history.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m src.run

      # The database is deliberately not committed back. Supabase holds the
      # signals and candles the dashboard reads, so the file was a duplicate
      # of that — and committing a 160KB binary every five minutes grew the
      # repository by roughly 1.4GB a month, since git cannot delta-compress
      # SQLite. The copy in data/ is a frozen snapshot, useful as a seed for
      # local runs and nothing more.
